name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check src app scripts tests
      - name: Test
        run: pytest
      - name: Small pipeline integration test
        run: python scripts/run_pipeline.py all
      - name: Dashboard import check
        run: python -c "import app.app"

